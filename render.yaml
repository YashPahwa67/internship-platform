# Render Blueprint — import or sync with your imp-api service
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: imp-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://internship-platform-eight.vercel.app
      - key: ALLOWED_ORIGINS
        value: https://internship-platform-eight.vercel.app
      - key: REDIS_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: imp
      - key: BREVO_API_KEY
        sync: false        # set in Render dashboard (brevo.com → SMTP & API → API Keys)
      - key: BREVO_FROM
        sync: false        # set to your verified sender, e.g. "Internship Platform <yashpahwa1209@gmail.com>"
      - key: SENDGRID_API_KEY
        sync: false        # set in Render dashboard (sendgrid.com → Settings → API Keys)
      - key: SENDGRID_FROM
        sync: false        # set to your Verified Single Sender, e.g. "Internship Platform <yashpahwa1209@gmail.com>"
      - key: RESEND_API_KEY
        sync: false        # set in Render dashboard (from resend.com → API Keys)
      - key: RESEND_FROM
        value: Internship Platform <onboarding@resend.dev>
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false        # set in Render dashboard (Gmail address)
      - key: SMTP_PASS
        sync: false        # set in Render dashboard (Gmail App Password, no spaces)
      - key: EMAIL_FROM
        sync: false        # set in Render dashboard (same Gmail address)
